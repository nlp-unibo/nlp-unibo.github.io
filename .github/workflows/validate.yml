name: Validate website

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate content and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Restore website toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            .tools
            .build/go-mod-cache
          key: website-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/site.py', '.github/workflows/hugo.yml', 'go.mod', 'go.sum') }}

      - name: Sync Python environment
        run: uv sync --locked

      - name: Run validator self-checks
        run: uv run --locked python scripts/test_site.py

      - name: Run script helper checks
        run: node --test scripts/test_ltcore.mjs

      - name: Validate content and production build
        run: uv run --locked python scripts/site.py check

      - name: Check rendered templates
        run: uv run --locked python scripts/test_render.py

      - name: Install Chromium for browser checks
        run: uv run --locked playwright install --with-deps chromium

      - name: Check page behaviour in a browser
        run: uv run --locked python scripts/test_browser.py
