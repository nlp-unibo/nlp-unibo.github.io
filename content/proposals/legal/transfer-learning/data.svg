<svg viewBox="0 0 800 296" role="img" aria-labelledby="transfer-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="transfer-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="transfer-title">Two questions of the proposal. First, data from two legal domains, fiscal state aid and equal treatment, reaches a large language model or a traditional model in three ways, in varying quantities: as training data, as demonstrations in the prompt, or as documents retrieved with retrieval-augmented generation; the model then performs legal argument mining. Second, transfer learning: a model built with the data of one domain is applied to the other domain.</title>
  <text class="lt-s-sub" x="20" y="22">LEGAL DOMAIN</text>
  <text class="lt-s-sub" x="250" y="22">HOW MUCH DATA, AND HOW</text>
  <text class="lt-s-sub" x="560" y="22">MODEL</text>
  <rect class="lt-s-box lt-s-pred" x="20" y="34" width="190" height="64" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="115" y="62">Fiscal state aid</text>
  <text class="lt-s-txt lt-s-small" x="115" y="82">annotated decisions</text>
  <rect class="lt-s-box lt-s-pred" x="20" y="196" width="190" height="64" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="115" y="224">Equal treatment</text>
  <text class="lt-s-txt lt-s-small" x="115" y="244">annotated decisions</text>
  <path class="lt-s-arrow" marker-start="url(#transfer-arrow)" marker-end="url(#transfer-arrow)" d="M115 104 V190"/>
  <text class="lt-s-txt lt-s-small" x="164" y="151">transfer</text>
  <rect class="lt-s-tok" x="250" y="40" width="250" height="52" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="375" y="62">Training data</text>
  <text class="lt-s-txt lt-s-small" x="375" y="80">a growing amount</text>
  <rect class="lt-s-tok" x="250" y="116" width="250" height="52" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="375" y="138">Prompt demonstrations</text>
  <text class="lt-s-txt lt-s-small" x="375" y="156">a growing number</text>
  <rect class="lt-s-tok" x="250" y="192" width="250" height="52" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="375" y="214">Retrieved with RAG</text>
  <text class="lt-s-txt lt-s-small" x="375" y="232">a growing collection</text>
  <path class="lt-s-arrow" d="M214 66 H232 V228 H214"/>
  <path class="lt-s-arrow" marker-end="url(#transfer-arrow)" d="M232 66 H246"/>
  <path class="lt-s-arrow" marker-end="url(#transfer-arrow)" d="M232 142 H246"/>
  <path class="lt-s-arrow" marker-end="url(#transfer-arrow)" d="M232 218 H246"/>
  <rect class="lt-s-box lt-s-sel" x="560" y="40" width="220" height="204" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="670" y="128">Large language model</text>
  <text class="lt-s-txt lt-s-small" x="670" y="148">or traditional model</text>
  <text class="lt-s-txt lt-s-small" x="670" y="170">legal argument mining</text>
  <path class="lt-s-arrow" marker-end="url(#transfer-arrow)" d="M504 66 H556"/>
  <path class="lt-s-arrow" marker-end="url(#transfer-arrow)" d="M504 142 H556"/>
  <path class="lt-s-arrow" marker-end="url(#transfer-arrow)" d="M504 218 H556"/>
  <text class="lt-s-txt lt-s-small" x="400" y="282">The thesis varies the quantity and the domain of the data, and compares the two kinds of model.</text>
</svg>
