<svg viewBox="0 0 800 240" role="img" aria-labelledby="unfair-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="unfair-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="unfair-title">Three clauses of a Terms of Service document go to a Transformer or a large language model. It marks two clauses as fair and the clause "We may change these terms at any time." as unfair, and then classifies the kind of unfair clause.</title>
  <text class="lt-s-sub" x="20" y="24">CLAUSES OF A TERMS OF SERVICE</text>
  <text class="lt-s-sub" x="650" y="24">DETECTION</text>
  <rect class="lt-s-box lt-s-pred" x="420" y="36" width="190" height="172" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="515" y="112">Transformer</text>
  <text class="lt-s-txt lt-s-strong" x="515" y="132">or LLM</text>
  <rect class="lt-s-tok" x="20" y="36" width="360" height="44" rx="8"/><text class="lt-s-txt" x="200" y="63">You can contact us by email.</text><path class="lt-s-arrow" marker-end="url(#unfair-arrow)" d="M384 58 H414"/><path class="lt-s-arrow" marker-end="url(#unfair-arrow)" d="M614 58 H644"/><rect class="lt-s-tok" x="650" y="40" width="120" height="36" rx="18"/><text class="lt-s-txt lt-s-strong" x="710" y="63">fair</text><rect class="lt-s-tok" x="20" y="100" width="360" height="44" rx="8"/><text class="lt-s-txt" x="200" y="127">We may change these terms at any time.</text><path class="lt-s-arrow" marker-end="url(#unfair-arrow)" d="M384 122 H414"/><path class="lt-s-arrow" marker-end="url(#unfair-arrow)" d="M614 122 H644"/><rect class="lt-s-label" x="650" y="104" width="120" height="36" rx="18"/><text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="710" y="127">unfair</text><text class="lt-s-txt lt-s-small" x="710" y="156">then its kind</text><rect class="lt-s-tok" x="20" y="164" width="360" height="44" rx="8"/><text class="lt-s-txt" x="200" y="191">We store the language you choose.</text><path class="lt-s-arrow" marker-end="url(#unfair-arrow)" d="M384 186 H414"/><path class="lt-s-arrow" marker-end="url(#unfair-arrow)" d="M614 186 H644"/><rect class="lt-s-tok" x="650" y="168" width="120" height="36" rx="18"/><text class="lt-s-txt lt-s-strong" x="710" y="191">fair</text>
</svg>
