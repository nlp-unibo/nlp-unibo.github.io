<svg viewBox="0 0 800 400" role="img" aria-labelledby="hatespeech-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="hatespeech-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="hatespeech-title">A text that relies on implicit content and subtle reasoning goes to argumentative reasoning, which makes the implicit content explicit as an argument: a premise, a fact, that supports a claim, a subjective conclusion. Premise and claim then feed hate speech detection, which aims to be more interpretable and more user-friendly.</title>
  <text class="lt-s-sub" x="40" y="22">INPUT TEXT</text>
  <rect class="lt-s-tok" x="200" y="32" width="400" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="400" y="56">Text</text>
  <text class="lt-s-txt lt-s-small" x="400" y="76">relies on implicit content and subtle reasoning</text>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-arrow)" d="M400 92 V120"/>
  <rect class="lt-s-box lt-s-sel" x="200" y="124" width="400" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="400" y="148">Argumentative reasoning</text>
  <text class="lt-s-txt lt-s-small" x="400" y="168">makes the implicit content explicit</text>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-arrow)" d="M400 184 V198 H210 V226"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-arrow)" d="M400 198 H590 V226"/>
  <text class="lt-s-sub" x="40" y="218">ARGUMENT</text>
  <rect class="lt-s-tok" x="80" y="230" width="260" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="210" y="254">Premise</text>
  <text class="lt-s-txt lt-s-small" x="210" y="274">a fact</text>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-arrow)" d="M344 258 H456"/>
  <text class="lt-s-txt lt-s-small" x="400" y="248">supports</text>
  <rect class="lt-s-tok" x="460" y="230" width="260" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="590" y="254">Claim</text>
  <text class="lt-s-txt lt-s-small" x="590" y="274">a subjective conclusion</text>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-arrow)" d="M210 290 V306 H300 V326"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-arrow)" d="M590 290 V306 H500 V326"/>
  <rect class="lt-s-box lt-s-pred" x="200" y="330" width="400" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="400" y="354">Hate speech detection</text>
  <text class="lt-s-txt lt-s-small" x="400" y="374">more interpretable and more user-friendly</text>
</svg>
