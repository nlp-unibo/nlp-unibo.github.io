  <rect class="lt-s-tok" x="287.8" y="32" width="46.8" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="311.2" y="55">the</text><rect class="lt-s-tok" x="340.6" y="32" width="56.4" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="368.8" y="55">food</text><rect class="lt-s-tok" x="403.0" y="32" width="46.8" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="426.4" y="55">was</text><rect class="lt-s-tok" x="455.8" y="32" width="56.4" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="484.0" y="55">cold</text>
  <path class="lt-s-arrow" marker-end="url(#treekernels-arrow)" d="M400 70 V96"/>
  <rect class="lt-s-tok" x="250" y="100" width="300" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="400" y="124">Transformation technique</text>
  <text class="lt-s-txt lt-s-small" x="400" y="144">turns the text into a tree</text>
