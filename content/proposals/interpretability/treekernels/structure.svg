  <rect class="lt-s-tok" x="121.8" y="284" width="56.4" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="150" y="307">food</text>
  <rect class="lt-s-tok" x="221.8" y="284" width="56.4" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="250" y="307">cold</text>
  <rect class="lt-s-tok" x="126.6" y="354" width="46.8" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="150" y="377">the</text>
  <path class="lt-s-arrow" marker-end="url(#treekernels-arrow)" d="M228 231 H296"/>
  <rect class="lt-s-box lt-s-sel" x="300" y="214" width="230" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="415" y="238">Rationalization system</text>
  <text class="lt-s-txt lt-s-small" x="415" y="258">extracts a rationale</text>
  <path class="lt-s-arrow" marker-end="url(#treekernels-arrow)" d="M415 300 V274"/>
  <rect class="lt-s-tok" x="300" y="300" width="230" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="415" y="324">Structural constraint</text>
  <text class="lt-s-txt lt-s-small" x="415" y="344">allowed: types of trees</text>
