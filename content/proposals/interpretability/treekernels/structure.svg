  <rect class="lt-s-off" x="571.8" y="284" width="56.4" height="34" rx="6"/><text class="lt-s-txt lt-s-mono" x="600" y="307">food</text>
  <rect class="lt-s-on" x="671.8" y="284" width="56.4" height="34" rx="6"/><text class="lt-s-txt lt-s-mono lt-s-ontxt" x="700" y="307">cold</text>
