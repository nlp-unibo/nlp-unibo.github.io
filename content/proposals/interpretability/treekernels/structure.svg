<svg viewBox="0 0 800 400" role="img" aria-labelledby="treekernels-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="treekernels-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="treekernels-title">The input text the food was cold goes through a transformation technique that turns it into a tree, the structured content. A rationalization system, guided by a structural constraint on the allowed types of trees, extracts a rationale from that tree: the connected nodes was and cold, while food and the are left out.</title>
