<svg viewBox="0 0 800 376" role="img" aria-labelledby="hatespeech-defs-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="hatespeech-defs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="hatespeech-defs-title">The same text goes to three socio-cultural contexts, cultures A, B, and C, each with its own definition of abusive and hate speech. Culture A deems the text offensive, culture B allows it, and culture C deems it legally prosecutable. All three judgments feed a detection model, and the question is how each definition affects it.</title>
  <text class="lt-s-sub" x="40" y="22">INPUT TEXT</text>
  <rect class="lt-s-tok" x="300" y="32" width="200" height="40" rx="8"/>
  <text class="lt-s-txt lt-s-strong" x="400" y="57">the same text</text>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M400 76 V90 H160 V118"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M400 90 V118"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M400 90 H640 V118"/>
  <rect class="lt-s-box lt-s-sel" x="60" y="122" width="200" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="160" y="146">Culture A</text>
  <text class="lt-s-txt lt-s-small" x="160" y="166">definition A</text>
  <rect class="lt-s-box lt-s-sel" x="300" y="122" width="200" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="400" y="146">Culture B</text>
  <text class="lt-s-txt lt-s-small" x="400" y="166">definition B</text>
  <rect class="lt-s-box lt-s-sel" x="540" y="122" width="200" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="640" y="146">Culture C</text>
  <text class="lt-s-txt lt-s-small" x="640" y="166">definition C</text>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M160 182 V212"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M400 182 V212"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M640 182 V212"/>
  <rect class="lt-s-label" x="62" y="216" width="196" height="36" rx="18"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="160" y="239">offensive</text>
  <rect class="lt-s-label" x="302" y="216" width="196" height="36" rx="18"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="400" y="239">allowed</text>
  <rect class="lt-s-label" x="542" y="216" width="196" height="36" rx="18"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="640" y="239">legally prosecutable</text>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M160 256 V296"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M400 256 V296"/>
  <path class="lt-s-arrow" marker-end="url(#hatespeech-defs-arrow)" d="M640 256 V296"/>
  <rect class="lt-s-box lt-s-pred" x="60" y="300" width="680" height="56" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="400" y="324">Detection model</text>
  <text class="lt-s-txt lt-s-small" x="400" y="344">how does each definition affect it?</text>
</svg>
