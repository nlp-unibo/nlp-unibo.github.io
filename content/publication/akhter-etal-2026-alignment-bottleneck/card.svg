  <path class="lt-s-arrow" marker-end="url(#akhter-etal-2026-card-arrow)" d="M234 268 H248"/>
  <rect class="lt-s-node lt-role-2" x="252" y="254" width="100" height="28" rx="8"/>
  <text class="lt-s-txt lt-s-small" x="302" y="272">evidence Ec</text>
  <path class="lt-s-arrow" marker-end="url(#akhter-etal-2026-card-arrow)" d="M90 286 V302"/>
