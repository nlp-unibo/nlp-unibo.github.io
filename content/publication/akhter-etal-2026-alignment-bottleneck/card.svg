  <rect class="lt-s-label" x="8" y="306" width="164" height="32" rx="16"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="90" y="327">Significant gain</text>
  <rect class="lt-s-tok" x="188" y="306" width="164" height="32" rx="16"/>
  <text class="lt-s-txt lt-s-strong" x="270" y="327">Negligible change</text>
