<svg viewBox="0 0 360 282" role="img" aria-labelledby="mmaf-card-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="mmaf-card-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="mmaf-card-title">Built from the task definition in Section 3 of the paper. A sentence from a political debate comes in one of three input modes: text only, audio only, or text with its aligned audio, and systems may also use the previous sentences of the debate as context. Fallacy detection (AFD) decides whether the sentence contains a fallacy. A fallacious sentence then goes to fallacy classification (AFC), which picks one of six fallacy types.</title>
  <text class="lt-s-sub" x="8" y="18">DEBATE SENTENCE, THREE INPUT MODES</text>
  <rect class="lt-s-tok" x="8" y="26" width="108" height="34" rx="8"/>
  <text class="lt-s-txt" x="62" y="48">Text only</text>
  <rect class="lt-s-tok" x="126" y="26" width="108" height="34" rx="8"/>
  <text class="lt-s-txt" x="180" y="48">Audio only</text>
  <rect class="lt-s-tok" x="244" y="26" width="108" height="34" rx="8"/>
  <text class="lt-s-txt" x="298" y="48">Text + audio</text>
  <text class="lt-s-txt lt-s-small" x="180" y="80">previous sentences as context</text>
  <path class="lt-s-arrow" marker-end="url(#mmaf-card-arrow)" d="M180 86 V100"/>
  <rect class="lt-s-box lt-s-pred" x="50" y="104" width="260" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="180" y="124">Detection (AFD)</text>
  <text class="lt-s-txt lt-s-small" x="180" y="142">fallacy or not</text>
  <path class="lt-s-arrow" marker-end="url(#mmaf-card-arrow)" d="M180 154 V174"/>
  <text class="lt-s-txt lt-s-small" x="236" y="169">if fallacious</text>
  <rect class="lt-s-box lt-s-sel" x="50" y="178" width="260" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="180" y="198">Classification (AFC)</text>
  <text class="lt-s-txt lt-s-small" x="180" y="216">one of six types</text>
  <path class="lt-s-arrow" marker-end="url(#mmaf-card-arrow)" d="M180 228 V242"/>
  <rect class="lt-s-label" x="110" y="246" width="140" height="30" rx="15"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="180" y="266">Fallacy type</text>
</svg>
