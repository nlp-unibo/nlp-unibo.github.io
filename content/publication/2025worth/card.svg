<svg viewBox="0 0 360 326" role="img" aria-labelledby="2025worth-card-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="2025worth-card-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="2025worth-card-title">Built from Sections 4 and 5 of the paper. Each Terms of Service sentence goes to two kinds of detectors. Seven prompted LLMs, never trained on the task, use one of three prompt strategies: single-prompt, multi-prompt, or pipeline. Eight supervised baselines, a linear SVM and seven transformers, are fine-tuned on the 85 training documents. Both answer for which of the nine unfairness categories the sentence is unfair. On the test split, the best LLM, Qwen-32B with the pipeline, reaches a test macro-F1 of 0.72 (Table 4), shown as 72 on a 0 to 100 scale, and the best fine-tuned model, Custom-LegalBERT, reaches 77.9 (Table 3).</title>
  <text class="lt-s-sub" x="8" y="18">TERMS OF SERVICE</text>
  <rect class="lt-s-tok" x="90" y="26" width="180" height="34" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="180" y="48">ToS sentence</text>
  <path class="lt-s-arrow" marker-end="url(#2025worth-card-arrow)" d="M150 64 V74 H92 V86"/>
  <path class="lt-s-arrow" marker-end="url(#2025worth-card-arrow)" d="M210 64 V74 H268 V86"/>
  <rect class="lt-s-off" x="8" y="90" width="168" height="132" rx="14"/>
  <text class="lt-s-sub" x="18" y="108">7 PROMPTED LLMS</text>
  <rect class="lt-s-tok" x="18" y="116" width="148" height="28" rx="8"/>
  <text class="lt-s-txt" x="92" y="135">Single-prompt</text>
  <rect class="lt-s-tok" x="18" y="150" width="148" height="28" rx="8"/>
  <text class="lt-s-txt" x="92" y="169">Multi-prompt</text>
  <rect class="lt-s-tok" x="18" y="184" width="148" height="28" rx="8"/>
  <text class="lt-s-txt" x="92" y="203">Pipeline</text>
  <rect class="lt-s-off" x="184" y="90" width="168" height="132" rx="14"/>
  <text class="lt-s-sub" x="194" y="108">8 BASELINES</text>
  <rect class="lt-s-box lt-s-sel" x="194" y="116" width="148" height="62" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="268" y="142">Fine-tuned</text>
  <text class="lt-s-txt lt-s-small" x="268" y="162">SVM, transformers</text>
  <text class="lt-s-txt lt-s-small" x="268" y="203">on 85 training ToS</text>
  <path class="lt-s-arrow" marker-end="url(#2025worth-card-arrow)" d="M92 226 V246 H116"/>
  <path class="lt-s-arrow" marker-end="url(#2025worth-card-arrow)" d="M268 226 V246 H244"/>
  <rect class="lt-s-label" x="120" y="232" width="120" height="28" rx="14"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="180" y="251">9 categories</text>
  <text class="lt-s-sub" x="8" y="284">BEST TEST MACRO-F1, 0 TO 100</text>
  <text class="lt-s-txt lt-s-strong" x="92" y="304">72</text>
  <text class="lt-s-txt lt-s-small" x="92" y="320">Qwen-32B, pipeline</text>
  <text class="lt-s-txt lt-s-strong" x="268" y="304">77.9</text>
  <text class="lt-s-txt lt-s-small" x="268" y="320">Custom-LegalBERT</text>
</svg>
