<svg viewBox="0 0 640 300" role="img" aria-labelledby="ds-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ds-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="ds-title">Disruptive situation detection as speech emotion recognition: a short speech recording is turned into audio features, and a classifier labels it disruptive (anger, sadness, fear, disgust) or non-disruptive (neutral, happiness, surprise, calm).</title>
  <text class="lt-s-sub" x="20" y="24">INPUT</text>
  <text class="lt-s-sub" x="230" y="24">SER MODEL</text>
  <text class="lt-s-sub" x="430" y="24">OUTPUT CLASS</text>

  <rect class="lt-s-tok" x="20" y="100" width="170" height="90" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="105" y="132">Speech recording</text>
  <text class="lt-s-txt lt-s-small" x="105" y="154">a few seconds of audio</text>
  <text class="lt-s-txt lt-s-small" x="105" y="172">of passenger speech</text>
  <path class="lt-s-arrow" marker-end="url(#ds-arrow)" d="M192 145 H226"/>

  <rect class="lt-s-box lt-s-pred" x="230" y="100" width="170" height="90" rx="12"/>
  <text class="lt-s-txt lt-s-strong" x="315" y="132">Audio features</text>
  <text class="lt-s-txt lt-s-small" x="315" y="150">MFCCs and RMSE</text>
  <text class="lt-s-txt lt-s-strong" x="315" y="176">SVM or CNN</text>
  <path class="lt-s-arrow" marker-end="url(#ds-arrow)" d="M402 135 L428 92"/>
  <path class="lt-s-arrow" marker-end="url(#ds-arrow)" d="M402 155 L428 198"/>

  <rect class="lt-s-box lt-s-sel" x="430" y="40" width="190" height="100" rx="12"/>
  <rect class="lt-s-label" x="440" y="54" width="170" height="28" rx="14"/>
  <text class="lt-s-txt lt-s-labeltxt lt-s-strong" x="525" y="73">Disruptive (D)</text>
  <text class="lt-s-txt lt-s-small" x="525" y="106">anger, sadness,</text>
  <text class="lt-s-txt lt-s-small" x="525" y="124">fear, disgust</text>

  <rect class="lt-s-tok" x="430" y="160" width="190" height="100" rx="12"/>
  <rect class="lt-s-label" x="440" y="174" width="170" height="28" rx="14"/>
  <text class="lt-s-txt lt-s-labeltxt lt-s-strong" x="525" y="193">Non-disruptive (ND)</text>
  <text class="lt-s-txt lt-s-small" x="525" y="226">neutral, happiness,</text>
  <text class="lt-s-txt lt-s-small" x="525" y="244">surprise, calm</text>

  <text class="lt-s-txt lt-s-small" x="320" y="288">Each emotion in the datasets is mapped to one of the two classes.</text>
</svg>
