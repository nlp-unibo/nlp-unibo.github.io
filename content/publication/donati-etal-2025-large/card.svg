<svg viewBox="0 0 360 296" role="img" aria-labelledby="donati-etal-2025-large-card-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="donati-etal-2025-large-card-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="donati-etal-2025-large-card-title">Built from Sections 3 and 4 of the paper. An LLM judge receives an Italian news article with one of its summaries, taken from 10 articles and 50 summaries, together with a rubric prompt for one of five editorial criteria. With few-shot examples and no fine-tuning, the judge returns a score from 1 to 5 and an explanation. An expert annotator scores the same summaries from 1 to 5, and the two sets of scores are compared through mean absolute error and Spearman's rank correlation.</title>
  <text class="lt-s-sub" x="8" y="18">INPUTS</text>
  <rect class="lt-s-tok" x="8" y="26" width="168" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="92" y="46">Article + summary</text>
  <text class="lt-s-txt lt-s-small" x="92" y="64">50 summaries</text>
  <rect class="lt-s-tok" x="184" y="26" width="168" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="268" y="46">Rubric prompt</text>
  <text class="lt-s-txt lt-s-small" x="268" y="64">5 criteria</text>
  <path class="lt-s-arrow" marker-end="url(#donati-etal-2025-large-card-arrow)" d="M92 74 V100"/>
  <path class="lt-s-arrow" marker-end="url(#donati-etal-2025-large-card-arrow)" d="M268 74 V87 H140 V100"/>
  <rect class="lt-s-box lt-s-sel" x="20" y="104" width="150" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="95" y="124">LLM judge</text>
  <text class="lt-s-txt lt-s-small" x="95" y="142">few-shot prompt</text>
  <rect class="lt-s-box lt-s-pred" x="190" y="104" width="150" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="265" y="124">Expert</text>
  <text class="lt-s-txt lt-s-small" x="265" y="142">same summaries</text>
  <path class="lt-s-arrow" marker-end="url(#donati-etal-2025-large-card-arrow)" d="M95 152 V172"/>
  <path class="lt-s-arrow" marker-end="url(#donati-etal-2025-large-card-arrow)" d="M265 152 V172"/>
  <rect class="lt-s-label" x="20" y="176" width="150" height="28" rx="14"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="95" y="195">score + reason</text>
  <rect class="lt-s-label" x="190" y="176" width="150" height="28" rx="14"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="265" y="195">score 1 to 5</text>
  <path class="lt-s-arrow" marker-end="url(#donati-etal-2025-large-card-arrow)" d="M95 206 V259 H106"/>
  <path class="lt-s-arrow" marker-end="url(#donati-etal-2025-large-card-arrow)" d="M265 206 V259 H254"/>
  <rect class="lt-s-tok" x="110" y="236" width="140" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="180" y="256">Agreement</text>
  <text class="lt-s-txt lt-s-small" x="180" y="274">MAE, Spearman's ρ</text>
</svg>
