  <title id="pdxai-setting-title">Explaining a Parkinson's detector: a speech recording becomes a spectrogram, the HuBERT detector labels it as Parkinson's disease or healthy control, and an explanation method uses the detector to produce a saliency map, which marks the time and frequency cells that drove the label.</title>
