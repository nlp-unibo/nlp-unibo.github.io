<svg viewBox="0 0 360 248" role="img" aria-labelledby="lippi-2016292-card-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="lippi-2016292-card-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="lippi-2016292-card-title">After Figure 1 and Section 4 of the paper. The user submits a plain text document to the MARGOT web server. The argument mining pipeline first splits the text into sentences and parses them with the Stanford parser. Two tree kernel classifiers, one for claims and one for evidence, then detect the argumentative sentences. For each of these sentences, an SVM-HMM sequence labeler detects the boundaries of every claim and piece of evidence. The result is an HTML page with the argument components highlighted.</title>
  <text class="lt-s-sub" x="8" y="18">QUERY</text>
  <rect class="lt-s-tok" x="8" y="26" width="344" height="36" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="180" y="49">Plain text document</text>
  <rect class="lt-s-node lt-role-1" x="8" y="76" width="344" height="88" rx="14"/>
  <text class="lt-s-sub" x="128" y="94">ARGUMENT MINING</text>
  <path class="lt-s-arrow" marker-end="url(#lippi-2016292-card-arrow)" d="M67 66 V100"/>
  <rect class="lt-s-tok" x="16" y="104" width="102" height="50" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="67" y="125">Sentences</text>
  <text class="lt-s-txt lt-s-small" x="67" y="143">parse trees</text>
  <path class="lt-s-arrow" marker-end="url(#lippi-2016292-card-arrow)" d="M120 129 H127"/>
  <rect class="lt-s-box lt-s-sel" x="129" y="104" width="102" height="50" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="180" y="125">Detection</text>
  <text class="lt-s-txt lt-s-small" x="180" y="143">tree kernels</text>
  <path class="lt-s-arrow" marker-end="url(#lippi-2016292-card-arrow)" d="M233 129 H240"/>
  <rect class="lt-s-box lt-s-pred" x="242" y="104" width="102" height="50" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="293" y="125">Boundaries</text>
  <text class="lt-s-txt lt-s-small" x="293" y="143">SVM-HMM</text>
  <text class="lt-s-sub" x="8" y="194">OUTPUT</text>
  <path class="lt-s-arrow" marker-end="url(#lippi-2016292-card-arrow)" d="M293 158 V202"/>
  <rect class="lt-s-label" x="214" y="206" width="138" height="30" rx="15"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="283" y="226">HTML page</text>
  <text class="lt-s-txt lt-s-small" x="90" y="216">claims in bold</text>
  <text class="lt-s-txt lt-s-small" x="90" y="236">evidence in italics</text>
</svg>
