<svg style="max-width: 640px; margin: 0 auto;" viewBox="0 0 460 250" role="img" aria-labelledby="pej-senses-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="pej-senses-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="pej-senses-title">The Italian word balena has a neutral sense, whale, with the neutral anchor cetaceo, and a pejorative sense, fat woman, with the pejorative anchor grassa. The context of the tweet decides which sense applies.</title>
  <text class="lt-s-sub" x="10" y="18">LEXICON WORD</text>
  <rect class="lt-s-tok" x="125" y="28" width="210" height="56" rx="10"/>
  <text class="lt-s-txt lt-s-strong lt-s-mono" x="230" y="54">balena</text>
  <text class="lt-s-txt lt-s-small" x="230" y="74">meaning depends on context</text>
  <path class="lt-s-arrow" marker-end="url(#pej-senses-arrow)" d="M190 84 L120 124"/>
  <path class="lt-s-arrow" marker-end="url(#pej-senses-arrow)" d="M270 84 L340 124"/>
  <rect class="lt-s-box lt-s-pred" x="10" y="128" width="210" height="62" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="115" y="152">Neutral sense</text>
  <text class="lt-s-txt lt-s-small" x="115" y="172">whale (the animal)</text>
  <rect class="lt-s-box lt-s-sel" x="240" y="128" width="210" height="62" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="345" y="152">Pejorative sense</text>
  <text class="lt-s-txt lt-s-small" x="345" y="172">fat woman (an insult)</text>
  <rect class="lt-s-off" x="30" y="202" width="170" height="40" rx="8"/>
  <text class="lt-s-txt lt-s-small" x="115" y="218">neutral anchor</text>
  <text class="lt-s-txt lt-s-mono" x="115" y="236">cetaceo</text>
  <rect class="lt-s-on" x="260" y="202" width="170" height="40" rx="8"/>
  <text class="lt-s-txt lt-s-small" x="345" y="218">pejorative anchor</text>
  <text class="lt-s-txt lt-s-mono" x="345" y="236">grassa</text>
</svg>
