<svg viewBox="0 0 360 302" role="img" aria-labelledby="recv-card-title" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="recv-card-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lt-s-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <title id="recv-card-title">After Figure 1 of the paper. Within the reasoning task of claim verification and a single-step reasoning process, a claim paired with evidence needs one atomic reasoning type: deduction, where the evidence states the answer, or abduction, where the verdict rests on the most plausible hypothesis. Either leads to a veracity. Averaged over LLMs and prompts on CLIMATE-FEVER, the error rate is 15.58% on deductive pairs and 48.58% on abductive ones.</title>
  <rect class="lt-s-node lt-role-1" x="8" y="8" width="344" height="232" rx="14"/>
  <text class="lt-s-sub" x="18" y="26">TASK: CLAIM VERIFICATION</text>
  <rect class="lt-s-node lt-role-3" x="16" y="34" width="328" height="198" rx="12"/>
  <text class="lt-s-sub" x="26" y="54">PROCESS: SINGLE STEP</text>
  <rect class="lt-s-tok" x="60" y="64" width="240" height="36" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="180.0" y="88.0">Claim + evidence</text>
  <path class="lt-s-arrow" marker-end="url(#recv-card-arrow)" d="M100 104 V136"/>
  <path class="lt-s-arrow" marker-end="url(#recv-card-arrow)" d="M260 104 V136"/>
  <rect class="lt-s-tok" x="24" y="140" width="152" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="100.0" y="160.0">Deduction</text>
  <text class="lt-s-txt lt-s-small" x="100.0" y="178.0">evidence states it</text>
  <rect class="lt-s-box lt-s-sel" x="184" y="140" width="152" height="46" rx="10"/>
  <text class="lt-s-txt lt-s-strong" x="260.0" y="160.0">Abduction</text>
  <text class="lt-s-txt lt-s-small" x="260.0" y="178.0">plausible hypothesis</text>
  <path class="lt-s-arrow" marker-end="url(#recv-card-arrow)" d="M100 190 V210 H126"/>
  <path class="lt-s-arrow" marker-end="url(#recv-card-arrow)" d="M260 190 V210 H234"/>
  <rect class="lt-s-label" x="130" y="196" width="100" height="28" rx="14.0"/>
  <text class="lt-s-txt lt-s-strong lt-s-labeltxt" x="180.0" y="215.0">veracity</text>
  <text class="lt-s-sub" x="8" y="264">LLM ERROR RATE, CLIMATE-FEVER</text>
  <text class="lt-s-txt lt-s-strong" x="100" y="290">15.58%</text>
  <text class="lt-s-txt lt-s-strong" x="260" y="290">48.58%</text>
</svg>
